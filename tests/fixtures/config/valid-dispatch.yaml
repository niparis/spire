# Synthetic configuration for offline parser and CLI tests. It is not a
# deployment configuration and its provider model IDs are intentionally fake.
#
# Kept in step with `SCHEMA_VERSION` and the `VALID_CONFIG` constant in
# crates/spire-application/src/config.rs. `spire config validate` must accept
# this file; crates/spire/tests/cli_smoke.rs enforces that.
schema_version: 4
linear:
  organization_id: org
  team_id: team
  ready_state_id: ready
  in_progress_state_id: progress
  in_review_state_id: review
  specs_needed_state_id: specs
  blocked_state_id: blocked
  done_state_id: done
  canceled_state_id: canceled
  bot_actor_id: bot
  credential_ref: env:LINEAR_TOKEN
  complexity_mapping: {1: small, 2: medium, 3: large, 5: xlarge}
  supported_type_labels: [type:bug, type:feature, type:refactor, type:chore]
  repository_mappings:
    - label: repo:spire
      repository: owner/spire
      enabled: true
github:
  installation_id: installation
  credential_ref: systemd:credentials/github-key
  webhook_secret_ref: env:GITHUB_WEBHOOK_SECRET
  request_timeout_seconds: 10
  repositories:
    - repository: owner/spire
      base_branch: main
      required_checks: [test]
      workspace_root: /var/lib/spire/workspaces/owner-spire
cloudflare:
  account_ref: account
  zone_ref: zone
  webhook_hostname: spire.example.test
harnesses:
  maker: {provider: codex, model: codex-model, effort: medium}
  reviewer: {provider: claude-code, model: claude-model, effort: medium}
concurrency:
  total_active_harness_runs: 3
  ai_initiated_active_harness_runs: 1
  mutating_runs_per_repository: 1
  active_runs_per_ticket: 1
  cleanup_global: 1
security:
  admin_access: loopback
  maker_push_mode: mechanical_publisher
  reviewer_can_push: false
  credential_can_merge: false
runtime:
  database_path: /var/lib/spire/data/spire.db
  database_max_connections: 4
  data_root: /var/lib/spire/data
  backup_root: /var/lib/spire/backups
  workspace_root: /var/lib/spire/workspaces
  evidence_root: /var/lib/spire/evidence
  implementation_timeout_seconds: 7200
  review_timeout_seconds: 1800
operations:
  minimum_free_disk_bytes: 10737418240
  minimum_free_inodes: 10000
  workspace_terminal_retention_seconds: 604800
  evidence_terminal_retention_seconds: 604800
  backup_retention_count: 7
  backup_interval_seconds: 86400
server:
  api_bind: 127.0.0.1:8080
  admin_bind: 127.0.0.1:8081
webhook:
  path: /webhooks/linear
  signing_secret_ref: systemd:credentials/linear-webhook-secret
  webhook_id: webhook
  replay_window_seconds: 60
  max_body_bytes: 262144
rollout:
  linear_writes_enabled: false
  allowed_team_ids: []
  allowed_repositories: []
  allowed_type_labels: []
  max_active_harness_runs: 1
