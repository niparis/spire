name: Build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_HOST: x86_64-unknown-linux-gnu
  RUST_TOOLCHAIN: 1.88.0
  TARGET_TRIPLE: x86_64-unknown-linux-musl

jobs:
  build:
    name: Verify and package Linux binary
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore Cargo downloads and build artifacts
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-v1-${{ runner.os }}-${{ env.TARGET_TRIPLE }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ env.TARGET_TRIPLE }}-

      - name: Restore the pinned Rust toolchain
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.rustup/toolchains/${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_HOST }}
            ~/.rustup/update-hashes/${{ env.RUST_TOOLCHAIN }}-${{ env.RUST_HOST }}
          key: rustup-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-${{ env.TARGET_TRIPLE }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install the pinned Rust toolchain and Linux target
        run: |
          rustup toolchain install "${RUST_TOOLCHAIN}" --profile minimal --component clippy,rustfmt
          rustup target add --toolchain "${RUST_TOOLCHAIN}" "${TARGET_TRIPLE}"

      - name: Install the MUSL linker
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the workspace
        run: cargo test --workspace

      - name: Test release validation fixtures
        run: |
          ./scripts/release/test-release-contract.sh
          ./scripts/release/test-release-promotion.sh

      - name: Package the release archive
        id: package
        env:
          DIST_DIR: ${{ github.workspace }}/dist
        run: ./scripts/release/package-release.sh

      - name: Upload the release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
